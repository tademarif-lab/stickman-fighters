name: ANDROID APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

jobs:
  apk:
    name: APK derle (arm64-v8a)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ortam degiskenleri
        run: |
          echo "ANDROIDAPI=31"  >> $GITHUB_ENV
          echo "NDKAPI=21"      >> $GITHUB_ENV
          echo "ARCH=arm64-v8a" >> $GITHUB_ENV
          echo "P4A_RELEASE=1"  >> $GITHUB_ENV

      - name: Sistem bagimliliklari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless ccache \
            autoconf automake libtool pkg-config cmake \
            libffi-dev libssl-dev zlib1g-dev libbz2-dev \
            libncurses-dev libncursesw5-dev xz-utils libjpeg-dev \
            python3-dev build-essential

      - name: Kaynak dosyalari hazirla
        run: python3 ANDROID/prepare.py

      - name: python-for-android kur
        run: |
          pip install -q --upgrade pip wheel
          pip install -q "cython==0.29.37" "python-for-android"
          p4a --version

      - name: Toolchain bootstrap (sdl2)
        run: p4a bootstrap --sdl2 --arch=arm64-v8a

      - name: Tarifleri derle
        run: |
          for r in libffi openssl setuptools six packaging pyparsing \
                   cython kivy sdl2_image sdl2_mixer sdl2_ttf pillow numpy; do
            echo "=== $r"
            p4a build_recipes --sdl2 --arch=arm64-v8a "$r" || true
          done

      - name: APK derle
        working-directory: ANDROID/app
        run: |
          p4a create \
            --arch=arm64-v8a \
            --package=com.katil5019.stickmanfighters \
            --name="STICKMAN FIGHTERS" \
            --version=1.4.0 \
            --requirements=python3,pygame2,setuptools \
            --launcher=main_mobile.py \
            --release \
            --permission=INTERNET \
            --bootstrap=sdl2 \
            .

      - name: APK topla ve adini duzelt
        run: |
          mkdir -p APK_CIKTI
          find "$HOME/.python-for-android/build" -name '*.apk' -exec cp {} APK_CIKTI/ \;
          cd APK_CIKTI
          apk=$(ls *.apk 2>/dev/null | head -n1)
          if [ -z "$apk" ]; then echo "APK BULUNAMADI"; exit 1; fi
          mv "$apk" "STICKMAN-FIGHTERS-1.4.0.apk"
          ls -lh

      - name: Releases'a yukle (site butonu calissin)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: STICKMAN FIGHTERS 1.4.0
          body: |
            ## STICKMAN FIGHTERS 1.4.0

            | Platform | Dosya |
            |---|---|
            | PC (Windows) | `STICKMAN-FIGHTRS-1.4.0-PC.zip` |
            | Telefon (Android) | `STICKMAN-FIGHTERS-1.4.0.apk` |
          files: APK_CIKTI/STICKMAN-FIGHTERS-1.4.0.apk
          fail_on_unmatched_files: false

      - name: APK ekle (artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: STICKMAN-FIGHTERS-apk
          path: APK_CIKTI
          retention-days: 90

      - name: Hata loglarini yukle
        if: failure()
        run: |
          mkdir -p APK_CIKTI
          find ANDROID -name '*.log' -exec tail -300 {} \; \
            > APK_CIKTI/hata_logu.txt 2>/dev/null || true
          ls -lh APK_CIKTI || true

      - name: Log dosyasi ekle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hata-loglari
          path: APK_CIKTI/hata_logu.txt