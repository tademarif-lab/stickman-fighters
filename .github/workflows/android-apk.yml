name: ANDROID APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Mimari"
        required: false
        default: "arm64-v8a"
      cache:
        description: "Onbellegi kullan (12 tarifin derlemesini saklar, sonraki kosular 10-15 dk)"
        required: false
        default: "evet"
        type: choice
        options:
          - "evet"
          - "hayir"
      release:
        description: "Bitince Releases'a yukle"
        required: false
        default: "evet"
        type: choice
        options:
          - "evet"
          - "hayir"
  push:
    branches: [master, main]
    paths:
      - 'ANDROID/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    name: APK derle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARCH: ${{ github.event.inputs.arch || 'arm64-v8a' }}
      USE_CACHE: ${{ github.event.inputs.cache || 'evet' }}
      DO_RELEASE: ${{ github.event.inputs.release || 'evet' }}
      TAG: v1.4.0

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Oyun dosyalarini hazirla
        run: |
          python3 ANDROID/prepare.py
          echo "--- ANDROID/app icerigi ---"
          ls -la ANDROID/app

      - name: Onbellegi geri yukle
        if: env.USE_CACHE == 'evet'
        uses: actions/cache@v4
        with:
          path: ANDROID/.p4a-cache
          key: p4a-${{ runner.os }}-${{ env.ARCH }}-${{ github.run_id }}
          restore-keys: |
            p4a-${{ runner.os }}-${{ env.ARCH }}-

      - name: APK derle (p4a docker)
        env:
          CACHE_MOUNT: ${{ env.USE_CACHE == 'evet' && '1' || '0' }}
        run: bash ANDROID/build_apk_docker.sh

      - name: APK topla
        id: apk
        run: |
          set -euo pipefail
          mkdir -p APK_CIKTI
          # p4a APK'yi dist/ degil, app dizininin KOKUNE kopyalar.
          # Yine de her iki yeri de ara.
          apk=""
          for d in ANDROID/app ANDROID/app/dist; do
            if ls "$d"/*.apk >/dev/null 2>&1; then
              apk=$(ls -1 "$d"/*.apk | head -n1)
              break
            fi
          done
          if [ -z "$apk" ]; then
            echo "::error::APK bulunamadi"
            ls -la ANDROID/app | head -30 || true
            exit 1
          fi
          echo "bulunan: $apk"
          cp "$apk" "APK_CIKTI/STICKMAN-FIGHTERS-1.4.0.apk"
          ls -lh APK_CIKTI
          echo "yol=$apk" >> $GITHUB_OUTPUT

      - name: Onbellegi kaydet
        if: always() && env.USE_CACHE == 'evet'
        uses: actions/cache/save@v4
        with:
          path: ANDROID/.p4a-cache
          key: p4a-${{ runner.os }}-${{ env.ARCH }}-${{ github.run_id }}

      # ---------------------------------------------------------- artifact
      - name: APK ekle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: STICKMAN-FIGHTERS-apk
          path: APK_CIKTI
          retention-days: 90

      # ---------------------------------------------------------- release
      - name: Releases'a yukle
        if: env.DO_RELEASE == 'evet'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: STICKMAN FIGHTERS 1.4.0
          body: |
            ## STICKMAN FIGHTERS 1.4.0

            | Platform | Dosya |
            |---|---|
            | PC (Windows) | `STICKMAN-FIGHTERS-1.4.0-PC.zip` |
            | Telefon (Android) | `STICKMAN-FIGHTERS-1.4.0.apk` |

            **Telefon kurulumu:** APK'yi indir -> dosyaya dokun ->
            "bilinmeyen kaynaklardan kur" iznini ver -> Kur.
          files: APK_CIKTI/STICKMAN-FIGHTERS-1.4.0.apk
          fail_on_unmatched_files: false

      # ---------------------------------------------------------- tani
      - name: APK dogrula (aapt2 badging)
        if: always()
        run: |
          apk=$(ls -1 ANDROID/app/*.apk 2>/dev/null | head -n1)
          if [ -z "$apk" ]; then
            echo "APK yok, dogrulama atlandi"
            exit 0
          fi
          echo "Dogrulanan dosya: $apk"
          # NOT: dogrulama scripti dosya olarak calistirilir. `bash -lc '...'`
          # icinde ic ice tirnak kullanmak $SDK gibi degiskenleri sifirlar.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/w" -v "$GITHUB_WORKSPACE/ANDROID:/t:ro" \
            -w /w -e SDK_DIR=/home/user/.android/android-sdk \
            kivy/python-for-android:latest \
            bash /t/apk_dogrula.sh "/w/$apk" 2>&1 | tee apk-badging.txt
          echo
          echo "### APK DOGRULAMA" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -80 apk-badging.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Ozet yaz
        if: always()
        run: |
          {
            echo "### STICKMAN FIGHTERS - APK derleme ozeti"
            echo ""
            echo "- mimari : $ARCH"
            echo "- onbellek: $USE_CACHE"
            echo "- durum  : ${{ job.status }}"
            echo ""
            echo "### APK"
            echo '```'
            ls -la APK_CIKTI 2>/dev/null || echo "(yok)"
            echo '```'
            echo ""
            echo "### ANDROID/app (ilk 20)"
            echo '```'
            ls -la ANDROID/app 2>/dev/null | head -20 || echo "(yok)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
