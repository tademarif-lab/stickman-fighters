name: ANDROID APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: APK derle (arm64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem bagimliliklari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            openjdk-17-jdk-headless \
            autoconf automake libtool \
            pkg-config cmake ccache \
            libffi-dev libssl-dev \
            zlib1g-dev libbz2-dev \
            libncurses-dev libncursesw5-dev \
            xz-utils libjpeg-dev \
            python3-dev

      - name: Buildozer kur
        run: |
          pip install --upgrade pip wheel
          pip install buildozer cython==0.29.37

      - name: Kaynak dosyalari hazirla
        run: python3 ANDROID/prepare.py

      - name: APK derle
        working-directory: ANDROID
        run: |
          yes | buildozer android debug 2>&1 | tail -1000

      - name: APK topla
        run: |
          mkdir -p APK_CIKTI
          find ANDROID -name '*.apk' -exec cp {} APK_CIKTI/ \;
          ls -lh APK_CIKTI/

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: STICKMAN-FIGHTERS-apk
          path: APK_CIKTI/*.apk
          retention-days: 90

      - name: Hata loglarini kaydet
        if: failure()
        run: |
          mkdir -p APK_CIKTI
          find ANDROID -name '*.log' -path '*buildozer*' \
            -exec tail -200 {} \; > APK_CIKTI/hata_logu.txt 2>/dev/null || true
          cat ANDROID/.buildozer/android/platform/build-arm64-v8a/build/other_builds/*/build.log 2>/dev/null | tail -200 >> APK_CIKTI/hata_logu.txt || true

      - name: Hata loglarini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hata-loglari
          path: APK_CIKTI/hata_logu.txt