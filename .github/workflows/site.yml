name: SITE (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - 'SITE/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Siteyi yayinla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: SITE
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Ayarlari guncelle (GitHub kullanici adi)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          sed -i "s|var OWNER = \"KULLANICI\";|var OWNER = \"${OWNER}\";|" index.html
          sed -i "s|var REPO  = \"stickman-fighters\";|var REPO  = \"${REPO}\";|" index.html
          grep -n 'var OWNER\|var REPO' index.html

      - name: Sayfayi hazirla
        run: |
          touch .nojekyll
          cp ../README.md ./KURULUM.md 2>/dev/null || true
          cp ../APK_YAPIMI.md . 2>/dev/null || true
          cp ../MOBIL_REHBERI.md . 2>/dev/null || true
          cp ../ONLINE_REHBERI.md . 2>/dev/null || true
          if [ -f ../oyun_ikon.png ]; then cp ../oyun_ikon.png favicon.png; fi
          ls -la

      - name: GitHub Pages kur
        uses: actions/configure-pages@v5

      - name: Yayinla
        uses: actions/upload-pages-artifact@v3
        with:
          path: SITE

      - id: deploy
        name: Yayin adresi
        uses: actions/deploy-pages@v4
